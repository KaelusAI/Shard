name: CI

on:
  push:
    branches: [1.0]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Check code style
        run: ./gradlew spotlessCheck

      - name: Run Detekt
        run: ./gradlew detekt

      - name: Run tests
        run: ./gradlew test

      - name: Run container-backed tests
        run: ./gradlew --no-daemon containerTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-reports
          path: build/reports/tests/
          if-no-files-found: ignore

  build:
    name: Build
    needs: check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Build shadow JAR
        run: ./gradlew shadowJar

      - name: Resolve shadow JAR path
        id: shadow-jar
        run: echo "path=$(./gradlew -q printShadowJarPath)" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Shard-${{ github.sha }}
          path: ${{ steps.shadow-jar.outputs.path }}
          if-no-files-found: error

  release-candidate:
    name: Release candidate
    if: github.event_name == 'push' && github.ref == 'refs/heads/1.0'
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Resolve candidate version
        id: version
        run: |
          base=$(./gradlew properties -q | sed -n 's/^version: //p')
          last=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -z "$last" ]; then
            last=$(git describe --tags --abbrev=0 2>/dev/null || true)
          fi
          if [ -n "$last" ]; then
            count=$(git rev-list "$last"..HEAD --count)
          else
            count=$(git rev-list HEAD --count)
          fi
          echo "number=$base-rc$count" >> "$GITHUB_OUTPUT"

      - name: Build shadow JAR
        run: ./gradlew shadowJar -PshardVersion=${{ steps.version.outputs.number }}

      - name: Resolve shadow JAR path
        id: shadow-jar
        run: |
          path=$(./gradlew -q printShadowJarPath \
            -PshardVersion=${{ steps.version.outputs.number }})
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Publish release candidate
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: rc
          name: ${{ steps.version.outputs.number }}
          prerelease: true
          make_latest: false
          body: |
            Release candidate built from `${{ github.sha }}` on `${{ github.ref_name }}`.
            Replaced by the next push to `${{ github.ref_name }}`.
          files: ${{ steps.shadow-jar.outputs.path }}
