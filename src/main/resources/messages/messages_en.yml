    - " <color:#00b4db>/shard monitor remove <player></color> <gray>- Stop watching this player</gray>"
    - " <color:#00b4db>/shard monitor clear</color> <gray>- Stop watching everyone</gray>"
    - " <color:#00b4db>/shard monitor output <type></color> <gray>- Choose where the monitor is drawn</gray>"
    - " <color:#00b4db>/shard monitor output add|remove <type></color> <gray>- Draw on several places at once</gray>"
    - "   <gray>actionbar - one line above the hotbar</gray>"
    - "   <gray>bossbar   - a bar at the top of the screen</gray>"
    - "   <gray>sidebar   - a scoreboard panel, best for several players (1.20.3+)</gray>"
    - "   <gray>chat      - a line per detection, or a periodic summary</gray>"
    - "   <gray>tablist   - in the player list header and footer</gray>"
    - " <color:#00b4db>/shard monitor set chat <live|summary></color> <gray>- Chat mode</gray>"
    - " <color:#00b4db>/shard monitor settings</color> <gray>- Show and edit all your settings</gray>"
    - " <color:#00b4db>/shard monitor stop</color> <gray>- Stop the monitor</gray>"
    - " <color:#00b4db>/shard monitor reset</color> <gray>- Restore default settings</gray>"
    - " <color:#00b4db>/shard monitor list</color> <gray>- List active sessions</gray>"
    - "<gray>A player whose name matches a subcommand is still reachable:</gray>"
    - "<gray>use</gray> <white>/shard monitor add <name></white> <gray>instead of</gray> <white>/shard monitor <name></white>"

