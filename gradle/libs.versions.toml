[versions]
kotlin = "2.4.10"
paper = "1.21.11-R0.1-SNAPSHOT"
packetevents = "2.13.0"
cloud = "2.0.0"
cloud-kotlin = "2.1.0"
adventure = "4.26.1"
exposed = "1.3.1"
flyway = "12.1.1"
testcontainers = "1.21.4"
detekt = "1.23.8"

[libraries]
paper-api = { module = "io.papermc.paper:paper-api", version.ref = "paper" }
shard-api = { module = "ac.shard:shard-api", version = "2.1.0" }
worldguard = { module = "com.sk89q.worldguard:worldguard-bukkit", version = "7.0.17" }
floodgate-api = { module = "org.geysermc.floodgate:api", version = "2.0-SNAPSHOT" }
packetevents-spigot = { module = "com.github.retrooper:packetevents-spigot", version.ref = "packetevents" }
bstats-bukkit = { module = "org.bstats:bstats-bukkit", version = "3.2.1" }

cloud-paper = { module = "org.incendo:cloud-paper", version.ref = "cloud" }
cloud-processors-requirements = { module = "org.incendo:cloud-processors-requirements", version = "1.0.0-rc.1" }
cloud-kotlin-extensions = { module = "org.incendo:cloud-kotlin-extensions", version.ref = "cloud-kotlin" }

adventure-platform-bukkit = { module = "net.kyori:adventure-platform-bukkit", version = "4.4.1" }
adventure-minimessage = { module = "net.kyori:adventure-text-minimessage", version.ref = "adventure" }
adventure-serializer-plain = { module = "net.kyori:adventure-text-serializer-plain", version.ref = "adventure" }
adventure-serializer-gson = { module = "net.kyori:adventure-text-serializer-gson", version.ref = "adventure" }

hikaricp = { module = "com.zaxxer:HikariCP", version = "7.1.0" }
slf4j-jdk14 = { module = "org.slf4j:slf4j-jdk14", version = "2.0.18" }
exposed-core = { module = "org.jetbrains.exposed:exposed-core", version.ref = "exposed" }
exposed-jdbc = { module = "org.jetbrains.exposed:exposed-jdbc", version.ref = "exposed" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-mysql = { module = "org.flywaydb:flyway-mysql", version.ref = "flyway" }
mariadb = { module = "org.mariadb.jdbc:mariadb-java-client", version = "3.5.9" }
jackson-databind = { module = "tools.jackson.core:jackson-databind", version = "3.1.0" }
jedis = { module = "redis.clients:jedis", version = "8.0.1" }

fastutil = { module = "it.unimi.dsi:fastutil", version = "8.5.18" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version = "26.1.0" }
configurate-yaml = { module = "org.spongepowered:configurate-yaml", version = "4.2.0" }
yaml-config-updater = { module = "ru.vyarus:yaml-config-updater", version = "1.4.4" }
koin-core = { module = "io.insert-koin:koin-core", version = "4.2.2" }
kotlinx-collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version = "0.5.1" }

junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version = "6.1.2" }
mockk = { module = "io.mockk:mockk", version = "1.14.11" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter", version.ref = "testcontainers" }
testcontainers-mariadb = { module = "org.testcontainers:mariadb", version.ref = "testcontainers" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version = "3.53.2.1" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version = "9.6.1" }
plugin-yml-bukkit = { id = "net.minecrell.plugin-yml.bukkit", version = "0.6.0" }
spotless = { id = "com.diffplug.spotless", version = "8.8.0" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
