name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Check code style
        run: ./gradlew spotlessCheck

      - name: Run Detekt
        run: ./gradlew detekt

      - name: Run tests
        run: ./gradlew test

      - name: Run container-backed tests
        run: ./gradlew --no-daemon containerTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports
          path: build/reports/tests/
          if-no-files-found: ignore

  build:
    name: Build
    needs: check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Build shadow JAR
        run: ./gradlew shadowJar

      - name: Resolve shadow JAR path
        id: shadow-jar
        run: echo "path=$(./gradlew -q printShadowJarPath)" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Shard-${{ github.sha }}
          path: ${{ steps.shadow-jar.outputs.path }}
          if-no-files-found: error

  release-candidate:
    name: Release candidate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Resolve candidate version
        id: version
        run: |
          base=$(./gradlew properties -q | sed -n 's/^version: //p')
          last=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          if [ -z "$last" ]; then
            last=$(git describe --tags --abbrev=0 2>/dev/null || true)
          fi
          if [ -n "$last" ]; then
            count=$(git rev-list "$last"..HEAD --count)
          else
            count=$(git rev-list HEAD --count)
          fi
          echo "number=$base-rc$count" >> "$GITHUB_OUTPUT"

      - name: Build shadow JAR
        run: ./gradlew shadowJar -PshardVersion=${{ steps.version.outputs.number }}

      - name: Resolve shadow JAR path
        id: shadow-jar
        run: |
          path=$(./gradlew -q printShadowJarPath \
            -PshardVersion=${{ steps.version.outputs.number }})
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Publish release candidate
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: rc
          name: ${{ steps.version.outputs.number }}
          prerelease: true
          make_latest: false
          body: |
            Release candidate built from `${{ github.sha }}` on `main`.
            Replaced by the next push to `main`.
          files: ${{ steps.shadow-jar.outputs.path }}
