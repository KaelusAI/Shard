name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, for example v1.2'
        required: true
        type: string

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Resolve version
        id: version
        run: |
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "number=${tag#v}" >> "$GITHUB_OUTPUT"
          case "$tag" in
            *-rc*|*-beta*|*-alpha*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Set up JDK 21
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Check code style
        run: ./gradlew spotlessCheck

      - name: Run Detekt
        run: ./gradlew detekt

      - name: Run tests
        run: ./gradlew test

      - name: Run container-backed tests
        run: ./gradlew --no-daemon containerTest

      - name: Build shaded JAR
        run: ./gradlew shadowJar -PshardVersion=${{ steps.version.outputs.number }}

      - name: Resolve shaded JAR path
        id: shaded-jar
        run: |
          path=$(./gradlew -q printShadowJarPath \
            -PshardVersion=${{ steps.version.outputs.number }})
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Build unbundled JAR
        run: |
          ./gradlew shadowJar -PshadePE=false \
            -PshardVersion=${{ steps.version.outputs.number }}

      - name: Resolve unbundled JAR path
        id: unbundled-jar
        run: |
          path=$(./gradlew -q printShadowJarPath -PshadePE=false \
            -PshardVersion=${{ steps.version.outputs.number }})
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          files: |
            ${{ steps.shaded-jar.outputs.path }}
            ${{ steps.unbundled-jar.outputs.path }}
