  limit-reached: "<prefix> <color:#ff4b2b>На этом сервере разрешено не больше <white><limit></white> сессий монитора одновременно.</color>"
  settings-header: "<prefix> <color:#a8ff78>Твои настройки монитора</color> <gray>(нажми на строку, чтобы изменить)</gray>"
  settings-entry: " <gray>•</gray> <white><setting></white> <gray>=</gray> <color:#00b4db><value></color>"
  settings-entry-hover: "<gray>Изменить</gray> <white><setting></white>"
  settings-hint: " <gray>Меняется командой</gray> <white>/shard monitor set <key> <value></white>"
  help:
    - "<gradient:#8e9eab:#eef2f3>-------- [ Монитор Shard ] --------</gradient>"
    - " <color:#00b4db>/shard monitor <player></color> <gray>- Следить за AI-вероятностью игрока</gray>"
    - " <color:#00b4db>/shard monitor add <player></color> <gray>- Добавить игрока к отслеживанию</gray>"
    - " <color:#00b4db>/shard monitor remove <player></color> <gray>- Убрать игрока из отслеживания</gray>"
    - " <color:#00b4db>/shard monitor clear</color> <gray>- Убрать всех</gray>"
    - " <color:#00b4db>/shard monitor output <type></color> <gray>- Выбрать, где рисуется монитор</gray>"
    - " <color:#00b4db>/shard monitor output add|remove <type></color> <gray>- Рисовать сразу в нескольких местах</gray>"
    - "   <gray>actionbar - строка над хотбаром</gray>"
    - "   <gray>bossbar   - полоса вверху экрана</gray>"
    - "   <gray>sidebar   - панель скорборда, удобна для нескольких игроков (1.20.3+)</gray>"
    - "   <gray>chat      - сводка или строка на каждый вердикт AI</gray>"
    - "   <gray>tablist   - в шапке и подвале списка игроков</gray>"
    - " <color:#00b4db>/shard monitor set chat <live|summary></color> <gray>- Режим чата</gray>"
    - " <color:#00b4db>/shard monitor settings</color> <gray>- Показать и изменить все настройки</gray>"
    - " <color:#00b4db>/shard monitor stop</color> <gray>- Остановить монитор</gray>"
    - " <color:#00b4db>/shard monitor reset</color> <gray>- Сбросить настройки</gray>"
    - " <color:#00b4db>/shard monitor list</color> <gray>- Список активных сессий</gray>"
    - "<gray>Игрок с ником как у подкоманды всё равно доступен:</gray>"
    - "<gray>используй</gray> <white>/shard monitor add <ник></white> <gray>вместо</gray> <white>/shard monitor <ник></white>"

